<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow Dashboard – klickbares Mockup</title>
<!--
  Klickbares Mockup des Flow Dashboards (Pilot, Branch pilot/flow-dashboard). Eine Datei, keine Abhängigkeiten,
  alle Daten sind Beispiele und leben nur im Browser. Oben rechts: Rolle (PM/PO ↔ Entwickler) und Gerät
  (Desktop ↔ Handy) umschalten; "Zugriffswege" zeigt Web, Tauri, Handy und Terminal nebeneinander.
-->
<style>
  :root {
    --bg: #151010; --surface: #1e1718; --surface2: #261d1e; --line: #332829; --text: #f2eeee; --muted: #b9a7a0;
    --accent: #ff8997; --secondary: #c9a87c; --ready: #7fd6a4; --warn: #f2b25c; --bad: #ff6b7d; --info: #8ab4ff;
    --font: "DM Sans", system-ui, -apple-system, sans-serif; --title: "Manrope", var(--font); --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0d0909; color: var(--text); font: 14px/1.45 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }
  #frame { min-height: 100vh; background: var(--bg); margin: 0 auto; position: relative; overflow: hidden; }
  body.mobile #frame { width: 390px; min-height: 0; height: 820px; margin: 24px auto; border-radius: 42px; border: 10px solid #2b2223; box-shadow: 0 20px 60px #000a; overflow-y: auto; }
  body.mobile #frame::-webkit-scrollbar { display: none; }

  /* top bar */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: #1a1314; position: sticky; top: 0; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 8px; font: 700 15px var(--title); white-space: nowrap; cursor: pointer; }
  .brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #c25b7a); display: inline-block; }
  .switcher { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; width: auto; max-width: 260px; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--surface2); color: var(--text); }
  .who { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--surface2); color: var(--secondary); }
  .demo-bar { display: flex; gap: 10px; align-items: center; padding: 6px 20px; background: #241a12; color: var(--secondary); font-size: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .demo-bar b { color: var(--text); }

  /* nav */
  .nav { display: flex; gap: 4px; padding: 8px 20px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .nav a { padding: 8px 12px; border-radius: 8px 8px 0 0; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; }
  .nav a.on { color: var(--text); border-bottom-color: var(--accent); }
  .nav a .count { background: var(--accent); color: #2a1013; border-radius: 999px; padding: 0 6px; font-size: 11px; margin-left: 4px; font-weight: 700; }
  body.mobile .topbar { padding: 34px 14px 10px; gap: 8px; }
  body.mobile .topbar .hide-m { display: none; }
  body.mobile .nav { position: sticky; bottom: 0; }
  body.mobile .demo-bar { display: none; }

  main { padding: 20px; max-width: 1280px; margin: 0 auto; }
  body.mobile main { padding: 14px; }
  h1 { font: 700 22px var(--title); margin: 0 0 4px; }
  h2 { font: 700 16px var(--title); margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: 2fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } .g4 { grid-template-columns: repeat(4, 1fr); } .g5 { grid-template-columns: repeat(5, 1fr); }
  body.mobile .g2, body.mobile .g3, body.mobile .g4 { grid-template-columns: 1fr; } body.mobile .g5 { grid-template-columns: repeat(2, 1fr); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .card.click { cursor: pointer; transition: border-color .15s; } .card.click:hover { border-color: var(--accent); }
  .kpi .n { font: 700 26px var(--title); } .kpi .l { color: var(--muted); font-size: 12px; }
  .kpi.warn .n { color: var(--warn); } .kpi.ok .n { color: var(--ready); } .kpi.bad .n { color: var(--bad); }
  .row { display: flex; align-items: center; gap: 10px; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; }
  .muted { color: var(--muted); } .small { font-size: 12px; } .mono { font-family: var(--mono); font-size: 12px; }
  .bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--ready); }

  .btn { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: #2a1013; border-color: var(--accent); font-weight: 700; }
  .btn.ok { background: #1f3a2b; border-color: #2f6b4b; color: var(--ready); }
  .btn.warn { background: #3a2c17; border-color: #6b4f22; color: var(--warn); }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  input[type=text], textarea, select { background: #120d0d; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  label.f { display: block; margin-bottom: 12px; } label.f span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); white-space: nowrap; }
  .chip.ready { color: var(--ready); border-color: #2f6b4b; } .chip.warn { color: var(--warn); border-color: #6b4f22; }
  .chip.bad { color: var(--bad); border-color: #6b2a33; } .chip.info { color: var(--info); border-color: #2b406b; }
  .chip.done { color: var(--muted); } .chip.agent { color: var(--accent); border-color: #6b3540; }
  .dev-tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--info); border: 1px dashed #2b406b; border-radius: 6px; padding: 1px 6px; }
  .prio { font-size: 11px; font-weight: 700; } .prio.Highest { color: var(--bad); } .prio.High { color: #ff9b6b; } .prio.Medium { color: var(--warn); } .prio.Low { color: var(--secondary); } .prio.Lowest { color: var(--muted); }
  .key { font-family: var(--mono); font-size: 12px; color: var(--secondary); cursor: pointer; text-decoration: underline dotted; }

  /* backlog */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .bl { display: grid; grid-template-columns: 22px 64px 1fr 120px 150px 190px 120px; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .bl.drag { opacity: .4; } .bl.over { border-color: var(--accent); }
  .grip { cursor: grab; color: var(--muted); user-select: none; }
  body.mobile .bl { grid-template-columns: 18px 1fr; } body.mobile .bl > .hm { display: none; }
  .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .toggle i { width: 32px; height: 18px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); position: relative; transition: .15s; }
  .toggle i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: .15s; }
  .toggle.on i { background: #1f3a2b; border-color: #2f6b4b; } .toggle.on i::after { left: 16px; background: var(--ready); }

  /* board */
  .board { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; }
  .col { background: #191314; border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 300px; }
  .col h3 { margin: 0 0 10px; font: 700 13px var(--title); display: flex; justify-content: space-between; }
  .tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .tcard:hover { border-color: var(--muted); }

  /* drawer / modal */
  .shade { position: fixed; inset: 0; background: #0009; z-index: 20; display: flex; justify-content: flex-end; }
  .shade.center { justify-content: center; align-items: center; }
  .drawer { width: min(560px, 100%); height: 100%; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 20px; }
  .modal { width: min(560px, 94%); max-height: 90vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  body.mobile .shade { position: absolute; }
  .x { float: right; background: none; border: 0; font-size: 20px; cursor: pointer; color: var(--muted); }
  .timeline { border-left: 2px solid var(--line); margin: 6px 0 0 6px; padding-left: 14px; }
  .timeline div { margin-bottom: 10px; position: relative; } .timeline div::before { content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .timeline div.now::before { background: var(--accent); }
  .devbox { border: 1px dashed #2b406b; border-radius: 10px; padding: 12px; margin-top: 14px; background: #121722; }
  .riskbox { border: 1px solid #6b4f22; background: #2a2114; border-radius: 10px; padding: 12px; margin: 10px 0; }

  /* chat */
  .chat { display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 12px; border-radius: 12px; background: var(--surface2); }
  .msg.me { align-self: flex-end; background: #3a1f25; }
  .msg.tool { font-family: var(--mono); font-size: 12px; background: #121722; color: var(--info); max-width: 100%; }
  .rec { border: 1px solid #2f6b4b; border-radius: 10px; padding: 8px 10px; margin-top: 8px; background: #16261d; }
  .meter { height: 10px; border-radius: 99px; background: var(--surface2); overflow: hidden; } .meter i { display: block; height: 100%; transition: width .4s; }

  .stepper { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0; }
  .stepper span { font-size: 11px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .stepper span.done { color: var(--ready); border-color: #2f6b4b; } .stepper span.cur { color: var(--accent); border-color: var(--accent); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1f3a2b; color: var(--ready); border: 1px solid #2f6b4b; border-radius: 10px; padding: 10px 16px; z-index: 40; box-shadow: 0 10px 30px #0008; }
  body.mobile .toast { position: absolute; bottom: 70px; width: 90%; }

  /* clients page */
  .win { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
  .win .chrome { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #221a1b; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .win .chrome i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; } .win .chrome .url { flex: 1; background: #120d0d; border-radius: 6px; padding: 2px 8px; margin-left: 8px; }
  .tui { background: #0b0b0b; color: #cfe8d6; font: 12px/1.35 var(--mono); padding: 12px; white-space: pre; overflow-x: auto; }
  .phone { width: 220px; border: 7px solid #2b2223; border-radius: 28px; overflow: hidden; margin: 0 auto; background: var(--bg); }
  .arch { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; align-items: stretch; }
  body.mobile .arch { grid-template-columns: 1fr; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
  .box.container { border-style: dashed; border-color: var(--info); }
  .box h4 { margin: 0 0 6px; font: 700 13px var(--title); }
  svg text { fill: var(--muted); font: 11px var(--font); }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* login */
  .login { max-width: 760px; margin: 60px auto; text-align: center; }
  body.mobile .login { margin: 30px auto; }
  .login .grid { text-align: left; margin-top: 20px; }
</style>
</head>
<body>

<script>
// ---------------------------------------------------------------- sample data (everything is fictional)
const USERS = {
  lena: { id: "lena", name: "Lena Weber", short: "LW", role: "pm", title: "Product Owner" },
  max: { id: "max", name: "Max Krüger", short: "MK", role: "dev", title: "Entwickler" },
};
const PROJECTS = [
  { key: "SHOP", name: "Webshop Relaunch", repo: "gitlab.example.com/shop/storefront", branch: "develop", schema: "feature/{key}", label: "ready-for-agent", test: "npm run test", members: ["Lena Weber · PO", "Max Krüger · Dev", "Sara Yilmaz · Dev"], health: "ok" },
  { key: "PORTAL", name: "Kundenportal", repo: "gitlab.example.com/portal/web", branch: "main", schema: "feature/{key}", label: "ready-for-agent", test: "npm test", members: ["Tom Becker · PM", "Max Krüger · Dev"], health: "warn" },
  { key: "APP", name: "Mobile App", repo: "gitlab.example.com/app/client", branch: "develop", schema: "feat/{key_lower}", label: "ready-for-agent", test: "", members: ["Lena Weber · PO", "Jonas Hahn · Dev"], health: "ok" },
];
// flow: backlog | ready | grill | implement | review | mr | test | rework | done | blocked
const T = (key, title, type, prio, flow, extra = {}) => ({ key, title, type, prio, flow, ready: ["ready","grill","implement","review","mr","test","rework","done","blocked"].includes(flow), ...extra });
const TICKETS = [
  T("SHOP-151", "Gutscheincodes im Checkout einlösen", "Story", "High", "grill", { lane: "feature", tier: "COMPLEX", kev: "vague", desc: "Kunden sollen im Checkout einen Gutscheincode eingeben können.", started: true }),
  T("SHOP-149", "Warenkorb verliert Artikel nach Login", "Bug", "Highest", "implement", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Sonnet", desc: "Nach dem Login sind zuvor als Gast hinzugefügte Artikel weg.", started: true }),
  T("SHOP-147", "Lieferzeit auf der Produktseite anzeigen", "Story", "Medium", "review", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Sonnet", started: true }),
  T("SHOP-145", "Firmenkunden: Pflichtfelder fehlen bei Registrierung", "Bug", "High", "mr", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Sonnet", mr: "!3312", risks: ["checkout/Profile.ts:593 — Login-Handler sendet das Profil ohne die neuen Felder erneut; eine späte Antwort überschreibt den Warenkorb."], started: true }),
  T("SHOP-141", "Newsletter-Checkbox standardmäßig abgewählt", "Task", "Low", "test", { lane: "quick", tier: "SIMPLE", kev: "ready", model: "Sonnet", mr: "!3301", stage: "https://dev.shop.example.com", started: true }),
  T("SHOP-138", "Suche findet Artikel mit Umlauten nicht", "Bug", "High", "test", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Sonnet", mr: "!3297", stage: "https://dev.shop.example.com", started: true }),
  T("SHOP-153", "Filter nach Marke auf Kategorieseiten", "Story", "Medium", "ready", { lane: "ticket", tier: "MODERATE", kev: "ready" }),
  T("SHOP-154", "Rechtschreibfehler im Footer (\"Impresum\")", "Task", "Lowest", "ready", { lane: "quick", tier: "SIMPLE", kev: "ready" }),
  T("SHOP-155", "Wie berechnet der Shop die Versandkosten?", "Task", "Low", "backlog", { lane: "question", tier: "SIMPLE", kev: "ready" }),
  T("SHOP-156", "Wunschliste teilen", "Story", "Medium", "backlog", { lane: "feature", tier: "COMPLEX", kev: "vague" }),
  T("SHOP-157", "Ladezeit der Startseite verbessern", "Story", "High", "backlog", { lane: "feature", tier: "COMPLEX", kev: "vague" }),
  T("SHOP-158", "Cookie-Banner: Ablehnen-Button gleich groß", "Bug", "Medium", "backlog", { lane: "quick", tier: "SIMPLE", kev: "ready" }),
  T("SHOP-131", "PayPal Express im Warenkorb", "Story", "High", "done", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Opus", mr: "!3260" }),
  T("SHOP-129", "Preise mit 2 Nachkommastellen in der Mini-Cart", "Bug", "Medium", "done", { lane: "quick", tier: "SIMPLE", kev: "ready", model: "Sonnet", mr: "!3255" }),
  T("SHOP-127", "Produktbilder lazy laden", "Task", "Low", "done", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Sonnet", mr: "!3249" }),
  T("SHOP-150", "Rabatt wird doppelt abgezogen bei Teillieferung", "Bug", "Highest", "blocked", { lane: "ticket", tier: "COMPLEX", kev: "ready", model: "Opus", blockedWhy: "Review: Blocker nach 2 Versuchen – Teillieferungen sind im Backend nicht testbar.", started: true }),
  T("PORTAL-88", "Passwort-Reset-Mail kommt nicht an", "Bug", "Highest", "implement", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Sonnet", started: true }),
  T("PORTAL-86", "Rechnungen als PDF herunterladen", "Story", "High", "grill", { lane: "feature", tier: "COMPLEX", kev: "vague", started: true }),
  T("PORTAL-84", "Profilbild hochladen", "Story", "Medium", "ready", { lane: "ticket", tier: "MODERATE", kev: "ready" }),
  T("PORTAL-80", "Dark Mode", "Story", "Low", "backlog", { lane: "feature", tier: "COMPLEX", kev: "vague" }),
  T("PORTAL-79", "Datumsformat im Verlauf", "Bug", "Low", "done", { lane: "quick", tier: "SIMPLE", kev: "ready", mr: "!412" }),
  T("APP-41", "Push-Benachrichtigung bei Versand", "Story", "High", "review", { lane: "ticket", tier: "MODERATE", kev: "ready", model: "Sonnet", started: true }),
  T("APP-39", "Absturz beim Öffnen alter Bestellungen", "Bug", "Highest", "done", { lane: "ticket", tier: "MODERATE", kev: "ready", mr: "!88" }),
  T("APP-43", "Biometrischer Login", "Story", "Medium", "backlog", { lane: "feature", tier: "COMPLEX", kev: "vague" }),
];
TICKETS.forEach((t, i) => (t.rank = i));

const GRILL = {
  "SHOP-151": [
    { q: "Wer darf Gutscheine einlösen – nur eingeloggte Kunden oder auch Gäste?", rec: "Auch Gäste. Sonst brechen Neukunden im Checkout ab, und genau die bekommen die meisten Gutscheine.", alt: "Nur eingeloggte Kunden" },
    { q: "Dürfen mehrere Gutscheine kombiniert werden?", rec: "Nein, ein Gutschein pro Bestellung. Kombinationen machen Rabattlogik und Retouren deutlich komplexer.", alt: "Ja, bis zu zwei" },
    { q: "Was passiert, wenn der Warenkorbwert nach dem Einlösen unter den Mindestbestellwert fällt?", rec: "Der Gutschein bleibt sichtbar, ist aber ausgegraut mit Hinweis \"Mindestbestellwert 50 € nicht erreicht\".", alt: "Gutschein wird automatisch entfernt" },
    { q: "Wie gehen wir mit Retouren um, wenn ein Gutschein eingelöst wurde?", rec: "Der Gutscheinwert wird anteilig auf die Artikel verteilt und bei Retoure anteilig nicht erstattet.", alt: "Gutschein verfällt bei jeder Retoure" },
  ],
};
const ACTIVITY = [
  { at: "09:42", text: "Agent hat SHOP-147 fertig entwickelt – unabhängiges Review läuft", kind: "agent" },
  { at: "09:15", text: "SHOP-151 wartet auf deine Antworten in der Klärung", kind: "you" },
  { at: "08:58", text: "SHOP-141 ist auf der Dev-Stage – bereit zum Testen", kind: "test" },
  { at: "Gestern", text: "SHOP-131 erledigt (MR !3260 gemerged)", kind: "done" },
  { at: "Gestern", text: "Kev hat 3 neue Tickets eingeordnet", kind: "agent" },
];

// ---------------------------------------------------------------- state
const S = { user: null, role: "pm", device: "desktop", project: "SHOP", agentSel: "SHOP-149", grill: {}, draft: null, transcript: {} };

// Plain-language status for non-technical readers; tech stage names stay in the developer view.
const PLAIN = {
  backlog: ["Im Backlog", ""], ready: ["Freigegeben für Agent", "ready"], grill: ["Klärung mit dir", "warn"],
  implement: ["Agent entwickelt", "agent"], review: ["Wird unabhängig geprüft", "info"], mr: ["Wartet auf Code-Review", "info"],
  test: ["Auf Dev-Stage – bitte testen", "warn"], rework: ["Nacharbeit nach deinem Test", "agent"], done: ["Erledigt", "done"], blocked: ["Braucht Hilfe", "bad"],
};
const STAGES = { implement: "implement", review: "review", mr: "mr_open", test: "merged", rework: "implement", grill: "grill", blocked: "blocked" };
const COLS = [["todo", "Zu erledigen", ["backlog", "ready"]], ["progress", "In Arbeit", ["grill", "implement", "rework", "blocked"]], ["review", "Review", ["review", "mr"]], ["test", "Testen (Dev-Stage)", ["test"]], ["done", "Erledigt", ["done"]]];
const PRIOS = ["Highest", "High", "Medium", "Low", "Lowest"];
const LANE = { question: "Frage", quick: "Klein", ticket: "Ticket", feature: "Feature" };

const isDev = () => S.role === "dev";
const proj = () => PROJECTS.find((p) => p.key === S.project);
const tickets = (k = S.project) => TICKETS.filter((t) => t.key.startsWith(k + "-")).sort((a, b) => a.rank - b.rank);
const byKey = (k) => TICKETS.find((t) => t.key === k);
const chip = (flow) => `<span class="chip ${PLAIN[flow][1]}">${PLAIN[flow][0]}</span>`;
const kevChip = (t) => t.kev === "ready" ? `<span class="chip ready" title="Kev: genug Infos zum Starten">Kev: startklar</span>` : `<span class="chip warn" title="Kev: braucht Klärung">Kev: zu vage</span>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function toast(text) {
  document.querySelectorAll(".toast").forEach((t) => t.remove()); // only the latest one
  const el = document.createElement("div"); el.className = "toast"; el.textContent = text;
  (S.device === "mobile" ? document.getElementById("frame") : document.body).appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ---------------------------------------------------------------- shell
function route() {
  const h = location.hash.replace(/^#\/?/, "").split("/");
  if (!S.user) return { page: "login" };
  if (h[0] === "p" && PROJECTS.some((p) => p.key === h[1])) { S.project = h[1]; return { page: "project", tab: h[2] || "overview", arg: h[3] }; }
  if (h[0] === "clients") return { page: "clients" };
  return { page: "projects" };
}

function cfdSvg(h = 220) {
  // 8 weeks, stacked: done, test, review, progress, todo (cumulative counts)
  const weeks = 8, w = 760, pad = 26; const data = [];
  for (let i = 0; i < weeks; i++) { const done = 3 + i * 2.2, test = 1 + (i % 3) * 0.6, review = 1.5 + (i % 2), prog = 2.5 + Math.sin(i) * 0.8, todo = 9 - i * 0.4; data.push([done, test, review, prog, todo]); }
  const max = Math.max(...data.map((d) => d.reduce((a, b) => a + b, 0))) * 1.1;
  const colors = ["#7fd6a4", "#f2b25c", "#8ab4ff", "#ff8997", "#5a4a4b"]; const names = ["Erledigt", "Testen", "Review", "In Arbeit", "Zu erledigen"];
  const x = (i) => pad + (i * (w - pad * 2)) / (weeks - 1); const y = (v) => h - 20 - (v / max) * (h - 30);
  let layers = "", base = Array(weeks).fill(0);
  for (let l = 0; l < 5; l++) {
    const top = data.map((d, i) => base[i] + d[l]);
    const pts = top.map((v, i) => `${x(i)},${y(v)}`).join(" ") + " " + base.map((v, i) => `${x(i)},${y(v)}`).reverse().join(" ");
    layers += `<polygon points="${pts}" fill="${colors[l]}" opacity=".85"/>`; base = top;
  }
  const labels = Array.from({ length: weeks }, (_, i) => `<text x="${x(i)}" y="${h - 4}" text-anchor="middle">KW ${36 + i}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="max-height:${h}px">${layers}${labels}</svg>
    <div class="legend">${names.map((n, i) => `<span><i style="background:${colors[i]}"></i>${n}</span>`).join("")}</div>`;
}

    <div class="card"><h2>Durchsatz pro Woche</h2><svg viewBox="0 0 400 150" width="100%">${thr.map((v, i) => `<rect x="${20 + i * 46}" y="${130 - v * 15}" width="30" height="${v * 15}" rx="4" fill="#ff8997"/><text x="${35 + i * 46}" y="145" text-anchor="middle">KW${36 + i}</text><text x="${35 + i * 46}" y="${124 - v * 15}" text-anchor="middle">${v}</text>`).join("")}</svg></div>
    <div class="card"><h2>Burnup bis zum Release-Ziel</h2><p class="small muted">Für Kanban mit Ziel: erledigt vs. Gesamtumfang. Steigt die obere Linie, wächst der Scope.</p>
      <svg viewBox="0 0 400 150" width="100%"><polyline points="20,60 70,58 120,55 170,52 220,48 270,47 320,45 370,44" fill="none" stroke="#c9a87c" stroke-width="2" stroke-dasharray="4 3"/><polyline points="20,135 70,125 120,118 170,105 220,96 270,85 320,76 370,66" fill="none" stroke="#7fd6a4" stroke-width="3"/><text x="372" y="40">Umfang</text><text x="372" y="62">erledigt</text></svg></div>
  </div>`;
}

function pageAgents(arg) {
  if (!isDev()) return `<h1>Kein Zugriff</h1><p class="sub">Agents sind nur für Entwickler sichtbar. Als PM/PO steuerst du über Backlog, Klärung und Testen.</p>`;
  const ts = tickets().filter((t) => t.started && t.flow !== "done");
  const sel = byKey(arg && byKey(arg)?.started ? arg : ts.find((t) => t.key === S.agentSel)?.key || ts[0]?.key); if (!sel) return `<h1>Agents</h1><p class="sub">Keine laufenden Agenten.</p>`;
  S.agentSel = sel.key;
  const steps = sel.lane === "feature" ? ["classify", "grill", "implement", "review", "mr_open"] : sel.lane === "quick" ? ["classify", "implement", "review", "mr_open"] : ["classify", "implement", "review", "mr_open"];
  const cur = steps.indexOf(STAGES[sel.flow]);
  const tr = S.transcript[sel.key] || (S.transcript[sel.key] = [
    { k: "me", t: `${sel.key} — ${sel.title}\nLane: ${LANE[sel.lane]} · Kev: ${sel.tier}` },
    { k: "tool", t: "read checkout/Cart.ts · read checkout/Profile.ts" },
    { k: "agent", t: sel.flow === "grill" ? "Ich kläre zuerst den Scope mit der PO (4 Fragen, 2 beantwortet)." : "Ursache gefunden: Beim Login wird der Gast-Warenkorb nicht übernommen. Ich ergänze das Mergen in mergeGuestCart() und einen Test." },
    ...(["review", "mr", "blocked"].includes(sel.flow) ? [{ k: "tool", t: "submit_fix → 3f2a91c · request_review → Runde 1" }] : []),
  ]);
  return `<div class="row between wrap"><div><h1>Agents <span class="dev-tag">nur Entwickler</span></h1><p class="sub">Die Orchestrierung: jeder gestartete Ticket-Agent mit Chat, Review und MR.</p></div></div>
  <div class="grid" style="grid-template-columns:260px 1fr">
    <div class="list">${ts.map((t) => `<div class="card click" style="padding:10px;${t.key === sel.key ? "border-color:var(--accent)" : ""}" data-go="#/p/${S.project}/agents/${t.key}">
      <div class="row between"><span class="mono">${t.key}</span><span class="chip">${STAGES[t.flow] || t.flow}</span></div><div class="small" style="margin-top:4px">${esc(t.title)}</div>
      ${t.risks ? `<span class="chip warn" style="margin-top:6px">⚠ Decision needed</span>` : t.flow === "blocked" ? `<span class="chip bad" style="margin-top:6px">blocked</span>` : ""}</div>`).join("")}</div>
    <div class="card">
      <div class="row between wrap"><div><span class="mono">${sel.key}</span> <b>${esc(sel.title)}</b></div>
        <div class="row"><span class="chip">${LANE[sel.lane]}</span><select style="width:auto"><option>${sel.model || "Sonnet"}</option><option>Opus</option></select></div></div>
      <div class="stepper">${steps.map((s, i) => `<span class="${i < cur ? "done" : i === cur ? "cur" : ""}">${s}</span>`).join("")}</div>
      ${sel.risks ? `<div class="riskbox"><b>⚠ Decision needed: offene Risiken nach Review</b><ul>${sel.risks.map((r) => `<li class="small">${esc(r)}</li>`).join("")}</ul><div class="small muted">MR ${sel.mr} ist ein Draft. Agent um Fix bitten oder Risiko akzeptieren.</div></div>` : ""}
      ${sel.flow === "blocked" ? `<div class="riskbox" style="border-color:#6b2a33;background:#2a1418"><b>Blockiert</b><div class="small">${esc(sel.blockedWhy)}</div></div>` : ""}
      <div class="chat" style="margin:12px 0">${tr.map((m) => `<div class="msg ${m.k === "me" ? "me" : m.k === "tool" ? "tool" : ""}" style="white-space:pre-wrap">${esc(m.t)}</div>`).join("")}</div>
      <div class="row"><input type="text" id="agentMsg" placeholder="Nachricht an den ${sel.key}-Agenten…" /><button class="btn primary" data-act="agentSend" data-key="${sel.key}">Senden</button></div>
      <div class="row wrap small" style="margin-top:10px">${sel.mr ? `<a href="#" onclick="return false">MR ${sel.mr} öffnen</a> ·` : ""} <a href="#" onclick="return false">Review-Session öffnen</a> · <a href="#" onclick="return false">Diff ansehen</a></div>
    </div></div>`;
}

    <div class="win"><div class="chrome"><span>Terminal — flow-tui</span></div><div class="tui">$ flow status SHOP

$ flow ready SHOP-153

// ---------------------------------------------------------------- drawer & modals
function ticketDrawer(key) {
  const t = byKey(key);
  const tl = [["Entdeckt", "Kev: " + (t.kev === "ready" ? "startklar" : "zu vage") + ` · ${LANE[t.lane]}`], ...(t.ready ? [["Für Agent freigegeben", "von Lena Weber"]] : []), ...(t.started ? [["Agent gestartet", t.model ? `Modell ${t.model}` : ""]] : []), ...(["review", "mr", "test", "done"].includes(t.flow) ? [["Unabhängig geprüft", t.risks ? "bestanden mit 1 offenem Risiko" : "bestanden"]] : []), ...(t.mr ? [["Merge Request " + t.mr, t.flow === "done" ? "gemerged" : "offen"]] : [])];
  return `<div class="shade" data-act="close"><div class="drawer" data-stop>
    <button class="x" data-act="close">×</button>
    <div class="mono muted">${t.key} · ${t.type}</div><h1 style="margin:6px 0">${esc(t.title)}</h1>
    <div class="row wrap">${chip(t.flow)} ${kevChip(t)} <span class="prio ${t.prio}">${t.prio}</span></div>
    <p>${esc(t.desc || "Beschreibung aus Jira …")}</p>
    <h2>Verlauf</h2><div class="timeline">${tl.map(([a, b], i) => `<div class="${i === tl.length - 1 ? "now" : ""}"><b>${a}</b><div class="small muted">${b}</div></div>`).join("")}</div>
    <h2 style="margin-top:14px">Aktionen</h2><div class="row wrap">
      ${t.started ? "" : `<span class="toggle ${t.ready ? "on" : ""}" data-act="ready" data-key="${t.key}"><i></i><span class="small">${t.ready ? "Freigegeben" : "Für Agent freigeben"}</span></span>`}
      ${t.flow === "grill" ? `<a class="btn small" href="#/p/${S.project}/clarify/${t.key}" data-act="close">Fragen beantworten</a>` : ""}
      ${t.flow === "test" ? `<button class="btn small warn" data-act="finding" data-key="${t.key}">Finding melden</button>` : ""}
      <a class="btn small" href="#" onclick="return false">In Jira öffnen ↗</a></div>
    ${isDev() ? `<div class="devbox"><span class="dev-tag">nur Entwickler</span><div class="small" style="margin-top:8px">Lane <b>${t.lane}</b> · Tier <b>${t.tier}</b>${t.model ? ` · Modell <b>${t.model}</b>` : ""}${t.mr ? ` · MR <b>${t.mr}</b>` : ""}</div>
      ${t.risks ? `<div class="riskbox small">⚠ ${esc(t.risks[0])}</div>` : ""}
      <div class="row wrap" style="margin-top:8px">${t.started ? `<a class="btn small" href="#/p/${S.project}/agents/${t.key}" data-act="close">Agent öffnen</a>` : `<button class="btn small" data-act="startAgent" data-key="${t.key}">Agent jetzt starten</button>`}<button class="btn small">Lane ändern</button></div></div>` : ""}
  </div></div>`;
}

function findingModal(key) {
  const t = byKey(key);
  return `<div class="shade center" data-act="close"><div class="modal" data-stop>
    <button class="x" data-act="close">×</button><h1>Finding melden</h1><p class="sub"><span class="mono">${t.key}</span> · ${esc(t.title)}</p>
    <label class="f"><span>Was hast du gemacht?</span><textarea id="fSteps">1. Suche nach „Müsli“ auf der Dev-Stage\n2. Ergebnisliste ansehen</textarea></label>
    <div class="grid g2" style="grid-template-columns:1fr 1fr"><label class="f"><span>Erwartet</span><textarea>Artikel „Bio-Müsli Classic“ erscheint</textarea></label><label class="f"><span>Tatsächlich</span><textarea id="fActual">Keine Treffer; mit „Muesli“ geht es</textarea></label></div>
    <label class="f"><span>Screenshot</span><div class="card small muted" style="text-align:center;border-style:dashed">📎 Bild hierher ziehen</div></label>
    <label class="f"><span>Wie schlimm?</span><select><option>Funktion fehlt / falsch</option><option>Schönheitsfehler</option><option>Blockiert den Release</option></select></label>
    <p class="small muted">Danach: Der bisherige Agent (falls noch vorhanden, sonst ein neuer) bekommt dein Finding, arbeitet nach und öffnet einen neuen MR. Das Ticket erscheint wieder unter „Testen“, sobald es auf der Dev-Stage ist.</p>
    <div class="row"><button class="btn primary" data-act="findingSend" data-key="${key}">Finding senden</button><button class="btn" data-act="close">Abbrechen</button></div>
  </div></div>`;
}

function newProjectModal() {
  return `<div class="shade center" data-act="close"><div class="modal" data-stop>
    <button class="x" data-act="close">×</button><h1>Neues Projekt</h1><p class="sub">Jeder darf Projekte anlegen. Ein Jira-Projekt gibt es nur einmal.</p>
    <label class="f"><span>Jira-Projekt (Schlüssel)</span><input type="text" id="npKey" placeholder="z. B. CRM oder SHOP" /></label><div id="npCheck" class="small" style="margin:-6px 0 12px"></div>
    <label class="f"><span>Name</span><input type="text" id="npName" placeholder="CRM Integration" /></label>
    <label class="f"><span>GitLab-Repository</span><input type="text" placeholder="gitlab.example.com/gruppe/projekt" /></label>
    <div class="grid g2" style="grid-template-columns:1fr 1fr"><label class="f"><span>Ziel-Branch</span><input type="text" value="develop"/></label><label class="f"><span>Branch-Schema</span><input type="text" value="feature/{key}"/></label></div>
    <label class="f"><span>Mitglieder einladen</span><input type="text" placeholder="E-Mail-Adressen, Rolle wählbar" /></label>
    <div class="row"><button class="btn primary" data-act="npCreate">Projekt anlegen</button><button class="btn" data-act="close">Abbrechen</button></div>
  </div></div>`;
}

// ---------------------------------------------------------------- render + events
function render() {
  document.body.classList.toggle("mobile", S.device === "mobile");
  const r = route(); let html;
  if (r.page === "login") html = pageLogin();
  else if (r.page === "projects") html = shell(pageProjects(), r);
  else if (r.page === "clients") html = shell(pageClients(), r);
  else {
    const pages = { overview: pageOverview, backlog: pageBacklog, board: pageBoard, new: pageNew, clarify: () => pageClarify(r.arg), testing: pageTesting, reports: pageReports, agents: () => pageAgents(r.arg), settings: pageSettings };
    html = shell((pages[r.tab] || pageOverview)(), r);
  }
  document.getElementById("app").innerHTML = html;
  wireDnD();
}

function overlay(html) {
  if (S.device !== "mobile") { document.getElementById("overlay").innerHTML = html; return; }
  // In the phone frame the overlay lives inside the frame, at its top.
  document.getElementById("frame").scrollTop = 0;
  const d = document.createElement("div"); d.id = "mOverlay"; d.innerHTML = html; document.getElementById("app").appendChild(d);
}
function closeOverlay() { document.getElementById("overlay").innerHTML = ""; document.getElementById("mOverlay")?.remove(); }

function wireDnD() {
  const list = document.getElementById("backlog"); if (!list) return; let dragKey = null;
  list.querySelectorAll(".bl").forEach((row) => {
    row.addEventListener("dragstart", () => { dragKey = row.dataset.key; row.classList.add("drag"); });
    row.addEventListener("dragend", () => row.classList.remove("drag"));
    row.addEventListener("dragover", (e) => { e.preventDefault(); row.classList.add("over"); });
    row.addEventListener("dragleave", () => row.classList.remove("over"));
    row.addEventListener("drop", (e) => {
      e.preventDefault(); row.classList.remove("over"); if (!dragKey || dragKey === row.dataset.key) return;
      const order = tickets().filter((t) => t.flow !== "done").map((t) => t.key).filter((k) => k !== dragKey);
      order.splice(order.indexOf(row.dataset.key), 0, dragKey); order.forEach((k, i) => (byKey(k).rank = i));
      render(); toast(`${dragKey} verschoben – Rangfolge in Jira aktualisiert`);
    });
  });
}

document.addEventListener("click", (e) => {
  const stop = e.target.closest("[data-stop]"); const el = e.target.closest("[data-act],[data-go],[data-ticket]");
  if (!el) return; if (stop && el.matches(".shade")) return;
  if (el.dataset.ticket) { overlay(ticketDrawer(el.dataset.ticket)); return; }
  if (el.dataset.go) { location.hash = el.dataset.go; return; }
  const a = el.dataset.act, k = el.dataset.key, v = el.dataset.v;
  const acts = {
    login: () => { S.user = v; S.role = USERS[v].role; location.hash = "#/projects"; render(); },
    logout: () => { S.user = null; location.hash = ""; render(); },
    role: () => { S.role = v; S.user = v === "dev" ? "max" : "lena"; render(); toast(v === "dev" ? "Ansicht: Entwickler – Agents-Tab und Dev-Details sichtbar" : "Ansicht: PM/PO – keine Agent-Werkzeuge"); },
    device: () => { S.device = v; closeOverlay(); render(); },
    close: () => closeOverlay(),
    ready: () => { const t = byKey(k); t.ready = !t.ready; t.flow = t.ready ? "ready" : "backlog"; closeOverlay(); render(); toast(t.ready ? `${k} für Agent freigegeben (Jira-Label gesetzt)` : `${k} zurück ins Backlog`); },
    newProject: () => overlay(newProjectModal()),
    npCreate: () => { const key = (document.getElementById("npKey").value || "CRM").toUpperCase(); if (PROJECTS.some((p) => p.key === key)) { document.getElementById("npCheck").innerHTML = `<span style="color:var(--warn)">${key} gibt es schon – <a href="#/p/${key}/overview">dort öffnen</a></span>`; return; }
      PROJECTS.push({ key, name: document.getElementById("npName").value || "CRM Integration", repo: "gitlab.example.com/crm/core", branch: "develop", schema: "feature/{key}", label: "ready-for-agent", test: "", members: [USERS[S.user].name], health: "ok" });
      TICKETS.push(T(key + "-1", "Erstes Ticket aus Jira", "Task", "Medium", "backlog", { lane: "ticket", tier: "SIMPLE", kev: "ready", rank: 0 })); closeOverlay(); location.hash = `#/p/${key}/overview`; toast(`Projekt ${key} angelegt – Poller läuft`); },
    startAgent: () => { const t = byKey(k); t.started = true; t.flow = t.lane === "feature" || t.kev === "vague" ? "grill" : "implement"; t.model = t.tier === "COMPLEX" ? "Opus" : "Sonnet"; closeOverlay(); render(); toast(`Agent für ${k} gestartet (${t.model})`); },
    draftStart: () => { S.draft.idea = document.getElementById("idea").value; S.draft.step = 1; render(); },
    draftAns: () => { S.draft.answers.push(v); render(); },
    draftCreate: () => { const key = `${S.project}-${160 + TICKETS.length}`; TICKETS.push(T(key, "Lieferadressen im Checkout speichern", "Story", "Medium", "backlog", { lane: "ticket", tier: "MODERATE", kev: "ready", rank: -1 })); S.draft.created = key; render(); toast(`${key} in Jira angelegt`); },
    grillAns: () => { S.grill[k].push(v); render(); },
    grillOwn: () => { const own = prompt("Deine Antwort:"); if (own) { S.grill[k].push(own); render(); } },
    grillConfirm: () => { byKey(k).flow = "implement"; render(); toast(`Scope für ${k} bestätigt – der Agent entwickelt jetzt`); location.hash = `#/p/${S.project}/overview`; },
    testOk: () => { byKey(k).flow = "done"; render(); toast(`${k} erledigt – in Jira auf Done gesetzt`); },
    finding: () => { closeOverlay(); overlay(findingModal(k)); },
    findingSend: () => { const t = byKey(k); t.flow = "rework"; t.finding = "Finding: " + (document.getElementById("fActual").value || ""); ACTIVITY.unshift({ at: "jetzt", text: `Finding zu ${k} – Agent arbeitet nach, neuer MR folgt`, kind: "agent" }); closeOverlay(); render(); toast(`Finding gesendet – Agent ${k} arbeitet nach, neuer MR folgt`); },
    agentSend: () => { const inp = document.getElementById("agentMsg"); if (!inp.value) return; S.transcript[k].push({ k: "me", t: inp.value }, { k: "agent", t: "Verstanden – ich passe das an und reiche es danach erneut zum Review ein." }); render(); },
  };
  acts[a]?.();
});

document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "switch") location.hash = `#/p/${el.value}/overview`;
  if (el.dataset.act === "prio") { byKey(el.dataset.key).prio = el.value; toast(`Priorität von ${el.dataset.key}: ${el.value} (in Jira gespeichert)`); }
});
// closing overlays: a click on the dark backdrop (not inside the panel)
document.addEventListener("mousedown", (e) => { if (e.target.classList?.contains("shade")) closeOverlay(); });

window.addEventListener("hashchange", () => { closeOverlay(); render(); });
