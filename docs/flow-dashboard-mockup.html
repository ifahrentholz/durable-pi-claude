<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow Dashboard – Mockup v2</title>
<!--
  Klickbares Mockup v2 des Flow Dashboards (Branch pilot/flow-dashboard): Jira Flow und Durable-Pi-Agent-Session in
  einer Oberfläche, im Design der bestehenden Apps. Eine Datei, Beispieldaten, alles läuft nur im Browser.
  Oben rechts: Rolle (PM/PO ↔ Entwickler) und Gerät (Desktop ↔ Handy). Das "?" zeigt Zugriffswege und Architektur.
-->
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;650;700&family=Manrope:wght@500;600;650;700;750&family=IBM+Plex+Mono:wght@400;500;600&display=swap");
:root {
  font-family: "DM Sans", system-ui, sans-serif; color: #f2eeee; background: #0d0909; font-size: 14.5px;
  --secondary: #c9a87c; --line: #332829; --accent: #ff8997; --surface: #1e1718; --title: "Manrope", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace; --ready: #7fd6a4; --warn: #f2b25c; --bad: #ff6b7d; --info: #9fc3d6;
}
* { box-sizing: border-box; }
body { margin: 0; background: #0d0909; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: none; border: 0; }
button:not(:disabled):hover { filter: brightness(1.13); }
input, textarea, select { background: #161011; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; outline: none; min-width: 0; }
input:focus, textarea:focus, select:focus { border-color: #856669; }
select { color-scheme: dark; cursor: pointer; }
textarea { resize: vertical; line-height: 1.55; }
h1, h2, h3, p { margin: 0; } h1, h2, h3 { font-family: var(--title); } h2 { font-size: 15px; font-weight: 650; }
pre, code { font-family: var(--mono); }
a { color: var(--accent); }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: #3d2e30; border-radius: 8px; }

.shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: #151010; }
body.mobile .shell { width: 390px; height: 820px; margin: 22px auto; border: 10px solid #2b2223; border-radius: 42px; box-shadow: 0 20px 60px #000a; position: relative; }

/* ---------- top bar */
.topbar { height: 56px; min-height: 56px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #1a1415; gap: 12px; }
.brand, .top-actions { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand strong { font: 750 15px var(--title); letter-spacing: -0.4px; white-space: nowrap; }
.brandmark { width: 40px; height: 22px; flex-shrink: 0; cursor: pointer; }
.brand-sep { color: #6f5a5c; }
.brand-scope { color: var(--secondary); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.pill { display: flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--secondary); border: 1px solid #3b3031; border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
.pill b { font-family: var(--mono); font-weight: 500; color: #f2eeee; }
.ring { transform: rotate(-90deg); } .ring .track { stroke: #3b3031; } .ring .fill { stroke: var(--ready); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #756062; display: inline-block; flex-shrink: 0; }
.dot.live { background: var(--accent); box-shadow: 0 0 9px #ff899766; animation: pulse 1.6s infinite; }
/* One colour language for every dot: pink pulsing = an agent works, yellow = waits for a person,
   red = blocked or paused, green = finished, grey = quiet. */
.dot.ok { background: var(--ready); } .dot.warn { background: var(--warn); } .dot.bad { background: #ff3b4e; box-shadow: 0 0 0 2px #ff3b4e55; } /* static + ring: a state, not activity */ .dot.idle { background: #6f5a5c; }
.seg { display: inline-flex; border: 1px solid #453032; border-radius: 8px; overflow: hidden; }
.seg button { padding: 4px 10px; font-size: 13px; color: #d9cdcd; } .seg button + button { border-left: 1px solid #453032; }
.seg button.on { background: #2b1f20; color: #f2eeee; }
.icon-btn { width: 30px; height: 30px; border-radius: 6px; color: var(--secondary); }
.icon-btn:hover { background: #ffffff0b; color: #f2eeee; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--title); background: #2b2021; color: var(--secondary); border: 1px solid #443738; cursor: pointer; }
.primary { padding: 8px 13px; background: var(--accent); color: #2a1013; border: 1px solid var(--accent); font-weight: 650; border-radius: 7px; white-space: nowrap; }
.secondary { border: 1px solid #443738; background: #2b2021; padding: 6px 11px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
.secondary.ok { color: var(--ready); border-color: #2f5b44; background: #18291f; } .secondary.warn { color: var(--warn); border-color: #5b4422; background: #2a2114; }
.ghost { color: var(--secondary); padding: 4px 6px; border-radius: 5px; } .ghost:hover { background: #ffffff0b; }

/* ---------- workspace */
.workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 240px minmax(0, 1.12fr) minmax(0, 1fr); }
.col { min-height: 0; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
.col:last-child { border-right: 0; }
.col-head { min-height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #1c1415; }
.col-body { flex: 1; overflow: auto; min-height: 0; }
.eyebrow { font-size: 12px; letter-spacing: 1.6px; font-weight: 600; color: var(--secondary); text-transform: uppercase; }

/* ---------- tree (left) */
.tree { background: #181213; }
.tree .section { padding: 12px 10px 4px 14px; display: flex; align-items: center; justify-content: space-between; }
.trow { display: flex; align-items: center; gap: 7px; padding: 6px 10px; margin: 1px 6px; border-radius: 6px; cursor: pointer; white-space: nowrap; color: #e9dede; border: 1px solid transparent; }
.trow:hover { background: #ffffff08; } .trow.on { background: #2b1f20; border-color: #4a3537; }
.trow .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.trow .tag { font: 11px var(--mono); color: var(--secondary); border: 1px solid #403536; border-radius: 4px; padding: 0 4px; }
.trow .n { font: 11.5px var(--mono); background: #c93a50; color: #fff; border-radius: 4px; padding: 0 5px; }
.trow .act { font: 11.5px var(--mono); color: var(--accent); } .trow .wk { font: 10.5px var(--mono); color: #9d8889; border: 1px solid #3b2c2e; border-radius: 3px; padding: 0 3px; }
.trow.off { opacity: .55; } .tgroup { padding: 10px 14px 3px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #9d8889; display: flex; justify-content: space-between; }
.newtag { font: 600 10px var(--mono); color: #2a1013; background: var(--accent); border-radius: 3px; padding: 0 4px; margin-right: 6px; }
.treemode { display: flex; gap: 0; margin: 4px 10px 2px; } .treemode .seg { width: 100%; } .treemode .seg button { flex: 1; }
.mlist button { width: 100%; justify-content: flex-start; text-align: left; padding: 10px; border-radius: 7px; gap: 12px; } .mlist button:hover:not(:disabled), .mlist button.on { background: #402b2d; }
.mlist button:disabled { opacity: .4; cursor: not-allowed; } .mlist small { display: block; color: #b9a5a6; font-size: 12.5px; }
.trow.l1 { padding-left: 24px; } .trow.l2 { padding-left: 40px; font-size: 13px; color: #d9cdcd; }
.chev { width: 12px; color: #9d8889; font-size: 10px; display: inline-block; transition: transform .15s; } .chev.open { transform: rotate(90deg); }
.worker { padding: 6px 14px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: #d9cdcd; }
.worker small { color: #9d8889; font-family: var(--mono); font-size: 11.5px; margin-left: auto; }

/* ---------- middle: tabs, feed */
.tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); background: #191213; padding: 0 8px; overflow-x: auto; scrollbar-width: none; min-height: 46px; }
.tabs button { padding: 0 11px; color: #d9cdcd; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14px; gap: 5px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:disabled { opacity: .35; cursor: default; }
.tabs .div { width: 1px; background: var(--line); margin: 10px 6px; }
.tabs .count { font: 11.5px var(--mono); padding: 0 5px; background: #462f31; border-radius: 4px; }
.dev-mark { font: 600 9.5px var(--mono); letter-spacing: .5px; color: var(--info); border: 1px dashed #36505e; border-radius: 4px; padding: 0 4px; }
.stream-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; gap: 10px; border-bottom: 1px solid var(--line); background: #1c1415; }
.stream-head small { font: 12px var(--mono); color: var(--secondary); display: block; }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-bottom: 1px solid var(--line); background: #181213; }
.stats > div { display: flex; flex-direction: column; padding: 8px 12px; border-right: 1px solid #2a2021; cursor: default; }
.stats > div:last-child { border-right: 0; }
.stats span { font: 500 17px var(--mono); } .stats small { font-size: 12px; color: #a99596; }
.stats .s-ready span { color: var(--secondary); } .stats .s-clar span { color: var(--warn); } .stats .s-wait span { color: var(--bad); } .stats .s-done span { color: var(--ready); }
.pinned { display: flex; align-items: center; gap: 9px; margin: 8px 10px 0; padding: 7px 10px; border: 1px solid #8a3c48; border-radius: 8px; background: #3a1a20; cursor: pointer; }
.pinned.ok { border-color: #3f6f55; background: #1a3326; } .pinned.warn { border-color: #6b5222; background: #2e2414; }
.pinned.bad { border-color: var(--bad); background: #4a1a22; box-shadow: 0 0 14px #ff6b7d33; } .pinned.idle { border-color: #3b2c2e; background: #1e1718; } .pinned.sel { outline: 1px solid #ffffff3a; }
.pinned strong { font-family: var(--mono); font-size: 13.5px; } .pinned .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; padding: 2px 9px; border-radius: 999px; background: #4a2028; color: #ffd0d6; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
.status.bad { background: #5a1a24; color: #ffc2ca; } .status.bad i { background: var(--bad); }
.status.idle { background: #352728; color: #e9dede; } .status.idle i { background: #8d7b7c; animation: none; }
.status.ok { background: #1f4733; color: #c9f5da; } .status.ok i { background: var(--ready); animation: none; }
.status.warn { background: #4a3517; color: #ffe1b3; } .status.warn i { background: var(--warn); animation: none; }
.open-agent { color: #ffd0d6; white-space: nowrap; font-size: 13px; } .ok .open-agent { color: #c9f5da; }
.log-head, .log-row { display: grid; grid-template-columns: 14px 62px 74px 1fr 128px 74px; gap: 9px; align-items: center; }
.log-head { padding: 9px 14px 5px; font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: #9d8889; border-bottom: 1px solid #2a2021; margin-top: 8px; }
.log-row { padding: 5px 14px; font: 13px var(--mono); border-bottom: 1px solid #ffffff08; border-left: 3px solid transparent; cursor: pointer; }
.log-row:hover { background: #ffffff06; } .log-row.sel { background: #ffffff0a; border-left-color: var(--accent); }
.log-row.new { animation: rowIn .45s ease, flash 1.6s ease; }
.log-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .log-row .t b { font-weight: 600; }
.grip { color: #6f5a5c; cursor: grab; user-select: none; visibility: hidden; } .log-row:hover .grip { visibility: visible; }
.log-row.drag { opacity: .35; } .log-row.over { border-top: 1px solid var(--accent); }
.prio { font: 700 11px var(--mono); letter-spacing: .02em; text-transform: uppercase; background: none; border: 0; padding: 0; cursor: pointer; }
.prio.Highest { color: var(--bad); } .prio.High { color: #ff9a62; } .prio.Medium { color: var(--warn); } .prio.Low, .prio.Lowest { color: #a99596; }
.lane { color: #e2c9a6; font-size: 12px; }
.chip { justify-self: end; font: 11.5px var(--mono); letter-spacing: .5px; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid transparent; white-space: nowrap; }
.chip.new { animation: chipIn .4s ease; }
.chip.pending { color: #9d8889; border-color: #3b2c2e; animation: pulse 1s infinite; }
.chip.ready { color: var(--ready); border-color: #2f5b44; } .chip.clar { color: var(--warn); border-color: #5b4422; }
.chip.progress { color: var(--secondary); border-color: var(--line); } .chip.waiting { color: var(--bad); border-color: #6b2a33; }
.chip.test { color: #1d1408; background: var(--warn); font-weight: 600; } .chip.done { color: var(--ready); opacity: .75; }
.chip.blocked { color: #fff; background: #c93a50; font-weight: 600; box-shadow: 0 0 12px #ff6b7d55; }
.rel { justify-self: end; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: #a99596; cursor: pointer; user-select: none; }
.sw { width: 26px; height: 15px; border-radius: 99px; background: #2b2021; border: 1px solid #443738; position: relative; transition: .15s; display: inline-block; flex-shrink: 0; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 9px; height: 9px; border-radius: 50%; background: #8d7b7c; transition: .15s; }
.sw.on { background: #1f4733; border-color: #3f6f55; } .sw.on::after { left: 13px; background: var(--ready); }

/* board / reports / settings / portfolio */
.board { display: grid; grid-template-columns: repeat(5, minmax(150px, 1fr)); gap: 8px; padding: 10px; min-width: 760px; }
.bcol { background: #181213; border: 1px solid var(--line); border-radius: 9px; padding: 8px; min-height: 260px; }
.bcol h3 { font-size: 12.5px; margin: 0 0 8px; display: flex; justify-content: space-between; color: #e9dede; }
.bcard { background: var(--surface); border: 1px solid #3b2c2e; border-radius: 7px; padding: 7px 8px; margin-bottom: 6px; cursor: pointer; font-size: 13px; }
.bcard:hover { border-color: #6b4a4d; } .bcard .k { font: 11.5px var(--mono); color: var(--secondary); display: flex; justify-content: space-between; }
.bcard .agent { color: var(--accent); font-size: 11.5px; display: flex; align-items: center; gap: 5px; margin-top: 4px; }
.pad { padding: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; font-size: 13.5px; } .kv dt { color: var(--secondary); } .kv dd { margin: 0; font-family: var(--mono); font-size: 13px; }
.field { display: block; margin-bottom: 10px; } .field span { display: block; font-size: 12px; color: var(--secondary); margin-bottom: 3px; } .field input, .field select, .field textarea { width: 100%; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #a99596; } .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
svg text { fill: #9d8889; font: 10.5px var(--font, "DM Sans"); }
.prow { display: grid; grid-template-columns: 1.4fr 70px 70px 70px 70px 1fr; gap: 10px; align-items: center; padding: 9px 14px; border-bottom: 1px solid #ffffff08; cursor: pointer; }
.prow:hover { background: #ffffff06; } .prow .num { font: 500 15px var(--mono); } .prow small { color: #a99596; font-size: 11.5px; display: block; }
.bar { height: 6px; border-radius: 99px; background: #2b2021; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--ready); }

/* ---------- right: conversation */
.side { background: #161011; }
.ctabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.ctab { padding: 6px 10px; border-radius: 6px; white-space: nowrap; color: #d9cdcd; border: 1px solid transparent; font-size: 13.5px; }
.ctab.on { background: #2b1f20; border-color: #4a3537; color: #f2eeee; }
.ctab .dot { width: 6px; height: 6px; }
.cost { font: 12.5px var(--mono); color: var(--secondary); white-space: nowrap; }
.model-chip { border: 1px solid #423435; background: #251c1d; border-radius: 7px; padding: 3px 8px 3px 4px; font-size: 13px; white-space: nowrap; }
.aimg { width: 20px; height: 20px; border-radius: 4px; background: #f0e8e9; color: #1a1a1a; font: 700 10px var(--title); display: grid; place-items: center; }
.icard { margin: 10px 12px 0; border: 1px solid #6b3a41; border-radius: 9px; background: linear-gradient(180deg, #3a1d22aa, #24161800); padding: 4px 12px 10px; }
.icard.ok { border-color: #3f6f55; background: linear-gradient(180deg, #1c3a2b99, #16201b00); }
.icard.warn { border-color: #6b5222; background: linear-gradient(180deg, #3a2c17aa, #22191300); }
.icard.bad { border-color: var(--bad); background: linear-gradient(180deg, #4a1a22cc, #22151700); }
.itop { display: flex; align-items: center; gap: 9px; padding: 8px 0 6px; }
.itop strong { font-family: var(--mono); } .itop .ititle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e9dede; }
.lchip { font: 10.5px var(--mono); text-transform: uppercase; letter-spacing: .5px; border: 1px solid #4a3537; border-radius: 99px; padding: 1px 6px; color: var(--secondary); }
.steps { display: flex; list-style: none; padding: 0; margin: 2px 0 8px; gap: 5px; }
.steps li { flex: 1; display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #9d8889; }
.steps li i { height: 4px; border-radius: 2px; background: #3b2c2e; }
.steps li.done { color: #e9dede; } .steps li.done i { background: var(--accent); } .ok .steps li.done i { background: var(--ready); }
.steps li.cur { color: #f2eeee; } .steps li.cur i { background: var(--accent); animation: pulse 1.2s infinite; }
.isum { line-height: 1.5; color: #e9dede; font-size: 13.5px; }
.risk { margin-top: 8px; border: 1px solid #6b5222; background: #2a2114; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.risk code { font-size: 12px; color: var(--secondary); }
.chat { flex: 1; overflow: auto; padding: 14px 18px 8px; min-height: 0; }
.entry { margin-bottom: 16px; } .entry.new { animation: slideIn .35s ease; }
.mlabel { display: flex; gap: 7px; align-items: center; font-size: 12.5px; letter-spacing: 1.2px; margin-bottom: 6px; color: #e9dede; }
.mlabel span { font-family: var(--mono); letter-spacing: 0; color: #9d8889; } .mlabel .stream { margin-left: auto; color: var(--accent); letter-spacing: 0; }
.pi-user .mlabel { justify-content: flex-end; } .umsg { line-height: 1.65; white-space: pre-wrap; text-align: right; }
.pi-user { padding-bottom: 12px; border-bottom: 1px solid #392628; }
.brief-label { color: var(--bad); }
.brief { border: 1px solid #6b3a41; background: linear-gradient(180deg, #3a1d2266, #22151700); border-radius: 8px; padding: 10px 12px; }
.brief p { white-space: pre-wrap; line-height: 1.6; font: 13px/1.6 var(--mono); }
.brief summary, .thinking summary { cursor: pointer; color: var(--secondary); font-size: 13px; }
.md { line-height: 1.65; font-size: 14px; } .md code { font-size: 12.5px; background: #3a2628; padding: 1px 5px; border-radius: 4px; }
.tool { border: 1px solid #453032; border-radius: 6px; background: #251819; margin: 6px 0; overflow: hidden; }
.tool summary { display: flex; gap: 8px; align-items: center; list-style: none; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.tool summary code { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #b9a5a6; font-size: 12px; min-width: 0; flex: 1; }
.tool pre { padding: 8px 10px; margin: 0; border-top: 1px solid #412b2d; font-size: 12px; max-height: 200px; overflow: auto; white-space: pre-wrap; }
.tstat { color: var(--secondary); white-space: nowrap; }
.live-tool { border: 1px solid #624346; background: #2c1d1e; border-radius: 6px; padding: 7px 10px; margin: 6px 0; font-size: 13px; display: flex; gap: 8px; align-items: center; animation: glow 1.6s infinite; }
.live-tool code { color: #b9a5a6; font-size: 12px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.typing { display: flex; gap: 5px; padding: 6px 0; } .typing i { height: 6px; width: 6px; background: #af7c81; border-radius: 50%; animation: pulse 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #5a3a3d; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
.rec { margin-top: 6px; border: 1px solid #2f5b44; border-radius: 8px; padding: 7px 9px; background: #16261d; font-size: 13.5px; }
.composer-region { padding: 8px 14px 10px; }
.composer { background: #281c1d; border: 1px solid #513d3f; border-radius: 10px; overflow: hidden; }
.composer textarea { width: 100%; display: block; resize: none; min-height: 52px; border: 0; background: none; padding: 10px 12px 4px; }

const LANE = { question: "Frage", quick: "Klein", ticket: "Ticket", feature: "Feature" };
const PRIOS = ["Highest", "High", "Medium", "Low", "Lowest"];
// chip per flow: [text, class]; PM wording, the dev view adds the stage name elsewhere
const CHIP = {
  backlog: (t) => (t.kev === "pending" ? ["Kev prüft…", "pending"] : t.kev === "ready" ? ["Bereit", "ready"] : ["Zu vage", "clar"]),
  ready: () => ["Freigegeben", "ready"], grill: () => ["Klärung", "waiting"], implement: () => ["Agent arbeitet", "progress"],
  review: () => ["Review", "progress"], mr: (t) => (t.risks ? ["Entscheidung", "waiting"] : ["MR offen", "waiting"]),
  test: () => ["Testen", "test"], rework: () => ["Nacharbeit", "progress"], done: () => ["Erledigt", "done"], blocked: () => ["Hilfe nötig", "blocked"],
};
const STAGE = { implement: "implement", grill: "grill", review: "review", mr: "mr_open", test: "merged", rework: "implement", done: "merged", blocked: "blocked" };
const STATUS = { ready: ["Freigegeben", "idle"], implement: ["Agent arbeitet", ""], grill: ["Wartet auf Klärung", "warn"], review: ["Review läuft", ""], mr: ["MR wartet auf Review", "warn"], test: ["Bitte testen", "warn"], rework: ["Nacharbeit", ""], blocked: ["Hilfe nötig", "bad"], done: ["Erledigt", "ok"] };
const worker = (t) => WORKERS.find((w) => w.id === t.worker);
const paused = (t) => t.started && t.worker && !worker(t).online && !["done", "test", "mr"].includes(t.flow);
const statusOf = (t) => (paused(t) ? ["Pausiert · Worker offline", "bad"] : STATUS[t.flow] || ["Im Backlog", "idle"]);
const chipOf = (t) => CHIP[t.flow](t);
const active = (t) => ["implement", "review", "rework"].includes(t.flow) && !paused(t);
// "Braucht dich", per role: POs clarify, test and release new tickets; developers test, review MRs and unblock.
const needsYou = (t) => isDev()
  ? t.fresh || t.flow === "test" || t.flow === "mr" || t.flow === "blocked" || paused(t)
  : t.fresh || t.flow === "grill" || t.flow === "test";
const dotOf = (t) => (paused(t) || t.flow === "blocked" ? "bad" : active(t) ? "live" : ["grill", "test", "mr"].includes(t.flow) || t.fresh ? "warn" : t.flow === "done" ? "ok" : "idle");
const DOT_TIP = { bad: "blockiert oder pausiert", live: "ein Agent arbeitet", warn: "wartet auf einen Menschen", ok: "fertig", idle: "ruhig" };
// A project's dot is the most urgent state of its tickets.
const projDot = (pk) => { const ds = ofProject(pk).map(dotOf); return ["bad", "warn", "live", "ok", "idle"].find((d) => ds.includes(d)) || "idle"; };
const steps = (t) => {
  if (t.lane === "question") return ["Eingeordnet", "Beantwortet"];
  return ["Eingeordnet", ...(t.lane === "feature" ? ["Klärung"] : []), "Entwicklung", "Review", "MR", "Testen", "Erledigt"];
};
const stepIndex = (t) => {
  const map = { backlog: 0, ready: 0, grill: 1, implement: t.lane === "feature" ? 2 : 1, rework: t.lane === "feature" ? 2 : 1, review: t.lane === "feature" ? 3 : 2, mr: t.lane === "feature" ? 4 : 3, blocked: t.lane === "feature" ? 3 : 2, test: t.lane === "feature" ? 5 : 4, done: 99 };
  return map[t.flow];
};

  let items; const cart = t.key === "SHOP-149";
  if (agent === "review") items = [

    { k: "tool", name: "bash", arg: `{"command": "git diff origin/develop...HEAD --stat"}`, out: " src/checkout/Profile.ts | 42 +++++++---\n src/checkout/Profile.test.ts | 61 ++++++++++\n 2 files changed, 91 insertions(+), 12 deletions(-)" },

      { k: "tool", name: "read", arg: `{"path": "src/checkout/cart.store.ts"}`, out: "… 180 Zeilen …" },

    ] : [

      { k: "tool", name: "bash", arg: `{"command": "rg -n -i \\"${t.title.split(" ")[0].toLowerCase()}\\" src | head"}`, out: "… 6 Treffer …" },
      { k: "agent", n: 22, text: "Die betroffene Stelle ist gefunden. Ich ändere sie minimal und ergänze einen Test, der genau dieses Verhalten prüft." },
    ]),
    ...(t.flow !== "implement" ? [{ k: "tool", name: "submit_fix", arg: `{"commit_message": "fix: ${t.title.slice(0, 40)} (${t.key})"}`, out: "Committed 3f2a91c on feature/" + t.key }, { k: "tool", name: "request_review", arg: "{}", out: `Review round ${t.round || 1} requested.` }] : []),

function counters(pk) {
  const ts = ofProject(pk), you = ts.filter(needsYou).length, act = ts.filter(active).length;
  return `${act ? `<span class="act" title="${act} Agent${act === 1 ? "" : "en"} arbeiten">▸${act}</span>` : ""}${you ? `<span class="n" title="${you} brauchen dich">${you}</span>` : ""}`;
}
function ticketRow(t, cls = "l1") {
  const w = worker(t);
  const rows = [`<div class="trow ${cls} ${S.sel === t.key ? "on" : ""}" data-sel="${t.key}" title="${esc(t.title)} · ${DOT_TIP[dotOf(t)]}${isDev() && w ? ` · ${w.name}` : ""}">
    <span class="dot ${dotOf(t)}"></span><span class="name">${t.key} <span style="color:#9d8889">${esc(t.title)}</span></span>${isDev() && w ? `<span class="wk">${w.short}</span>` : ""}</div>`];

    rows.push(`<div class="trow l2 ${S.ctab === "main" ? "on" : ""}" data-ctab="main">💬 Main</div>`);
    if (t.round) rows.push(`<div class="trow l2 ${S.ctab === "review" ? "on" : ""}" data-ctab="review">🔍 Review #${t.round} <span class="wk" title="Reviewer fest auf Opus">Opus</span></div>`);
  }
  return rows.join("");
}
function allTree() {
  const rows = [`<div class="trow ${!S.project ? "on" : ""}" data-act="portfolio"><span class="chev"></span>▦ <span class="name">Alle Projekte</span></div>`];
  for (const p of PROJECTS) {

function cfd(h = 170) {
  const W = 620, P = 22, n = 8, data = [];
  for (let i = 0; i < n; i++) data.push([3 + i * 2.2, 1 + (i % 3) * .6, 1.5 + (i % 2) + (i > 4 ? 1.2 : 0), 2.5 + Math.sin(i) * .8, 9 - i * .4]);
  const max = Math.max(...data.map((d) => d.reduce((a, b) => a + b))) * 1.08, col = ["#7fd6a4", "#f2b25c", "#9fc3d6", "#ff8997", "#4a3b3c"];
  const x = (i) => P + i * (W - 2 * P) / (n - 1), y = (v) => h - 18 - v / max * (h - 26);
  let base = Array(n).fill(0), out = "";
  for (let l = 0; l < 5; l++) { const topv = data.map((d, i) => base[i] + d[l]); out += `<polygon fill="${col[l]}" opacity=".85" points="${topv.map((v, i) => `${x(i)},${y(v)}`).join(" ")} ${base.map((v, i) => `${x(i)},${y(v)}`).reverse().join(" ")}"/>`; base = topv; }
  return `<svg viewBox="0 0 ${W} ${h}" width="100%">${out}${data.map((_, i) => `<text x="${x(i)}" y="${h - 4}" text-anchor="middle">KW ${36 + i}</text>`).join("")}</svg>
    <div class="legend">${["Erledigt", "Testen", "Review", "In Arbeit", "Zu erledigen"].map((l, i) => `<span><i style="background:${col[i]}"></i>${l}</span>`).join("")}</div>`;
}

// ---------- dev inspector panels

  return `<section class="insp-sec"><h1>${t.key} · ${esc(t.title)} <button class="ghost">✎</button></h1>
      <div class="path">📁 …/jira-flow/.data/worktrees/${t.key}</div>
      <div class="row"><span class="status-pill ${active(t) ? "working" : ""}"><i></i>${paused(t) ? "Paused" : active(t) ? "Working" : "Idle"}</span><span style="color:${worker(t)?.online ? "#d9cdcd" : "var(--bad)"}" title="Worktree und Session liegen auf diesem Worker">🖥 ${worker(t)?.name || "–"}${worker(t)?.online ? "" : " · offline"}</span></div></section>
    <section class="insp-sec"><div class="slabel">Agent</div>
      <button class="model-btn" data-act="model"><span class="aimg">A\\</span><div>Claude ${t.model || "Sonnet 5.5"} · Abo<small>S+ / claude-code · Kev-Tier ${t.tier}</small></div>▾</button>
      <div class="row"><span>Thinking</span><select style="border:0;background:none;padding:0"><option>high</option><option>medium</option><option>low</option></select></div>
      <div class="row perm"><span>Permissions</span><div class="seg">${["ask", "auto", "yolo"].map((m) => `<button class="${m} ${perm === m ? "on" : ""}" data-act="perm" data-v="${m}">${m === "yolo" ? "YOLO" : m[0].toUpperCase() + m.slice(1)}</button>`).join("")}</div></div>
      <p class="phint ${perm}">${HINT[perm]}</p></section>
    <section class="insp-sec"><div class="slabel">Context <a href="#" data-act="noop">ⓘ Details</a></div>
      <div class="ctx-num"><span id="ctxnum">${k(t.tokens)}</span><small>of 1.00M tokens · <span id="ctxpct">${pct.toFixed(0)}</span>%</small></div>
      <div class="ctxbar"><div class="fill" id="ctxfill" style="width:${pct}%"></div>
        <div class="mk auto" id="mkA" style="left:${S.compact / 10}%"></div><div class="lab auto" id="labA" style="left:${S.compact / 10}%">Auto-compact at ${S.compact}.0k</div>
        <div class="mk res" id="mkR" style="left:${S.compact / 10 + 5}%"></div><div class="lab res" id="labR" style="left:${S.compact / 10 + 5}%">Reserve at ${S.compact + 50}.0k</div></div>
      <input type="range" class="ctxrange" min="50" max="800" step="10" value="${S.compact}" data-act="compact" title="Auto-Compaction-Schwelle ziehen">
      <p class="phint">Kompaktiert im Hintergrund ab <b id="cphA">${S.compact}.0k</b> und wartet bei <b id="cphR">${S.compact + 50}.0k</b>. Gilt für alle Agenten dieser Session.</p></section>
    <section class="insp-sec"><div class="slabel">Stats</div><div class="metrics"><div><span id="stattok">${k(t.tokens)}</span><small>total tokens</small></div><div><span id="statcost">$${t.cost.toFixed(4)}</span><small>API equivalent</small></div><div><span>14</span><small>tools</small></div></div></section>`;
}
function stateP(t) {
  const doc = { key: t.key, stage: STAGE[t.flow], lane: t.lane, plan: { review: true, steps: steps(t) }, review: t.round ? { round: t.round, verdict: t.risks ? "pass_with_risks" : "pass", risks: (t.risks || []).map(([l, s]) => ({ location: l, statement: s })) } : null, report: { branch: `feature/${t.key}`, mrUrl: t.mr ? `https://gitlab.example.com/shop/storefront/-/merge_requests/${t.mr.slice(1)}` : null } };
  return `<div class="pad"><div class="slabel">App State · flow.tickets["${t.key}"] <span class="tagx">rev 41</span></div><p class="phint" style="margin:0 0 8px">Der durable Zustand dieses Tickets. Änderungen gelten ab dem nächsten Schritt des Agenten.</p>
    <textarea class="json" spellcheck="false">${esc(JSON.stringify(doc, null, 2))}</textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="secondary">Verwerfen</button><button class="primary" data-act="saved">Speichern</button></div></div>`;
}
function tasksP(t) {
  const rows = [
    ...(active(t) ? [["tool · bash", "npm run test -- cart", "running"], ["run", "Agent-Turn #22", "running"]] : []),

  ];
  return rows.map(([n, d, s]) => `<div class="list-row"><span class="${s === "running" ? "spin" : "dot " + (s === "done" ? "ok" : "")}"></span><div class="grow"><code>${n}</code><small>${d}</small></div><span class="tagx">${s}</span>${s === "running" ? `<button class="secondary" style="padding:2px 8px" data-act="noop">Abbrechen</button>` : ""}</div>`).join("") + `<p class="phint" style="padding:10px 18px">Durable Tasks überleben Neustarts; „Abbrechen“ beendet sie sauber.</p>`;
}
function toolsP() {

}
function extendP() {

// ======================================================================= right: ticket / agent / assistant
function side() {
  let head = "", body = "";
  if (S.draft) [head, body] = assistant();
  else if (!S.sel) [head, body] = desk();
  else {
    const t = byKey(S.sel);
    if (!isDev() || !t.started) S.ctab = "ticket";
    const tabs = [["ticket", "Ticket"], ...(isDev() && t.started ? [["main", "Main"], ...(t.round ? [["review", `Review #${t.round}`]] : [])] : [])];
    head = `<div class="ctabs">${tabs.map(([id, l]) => `<button class="ctab ${S.ctab === id ? "on" : ""}" data-ctab="${id}">${id === "main" && active(t) ? `<span class="dot live"></span>` : ""}${l}</button>`).join("")}</div>
      ${isDev() && t.started ? `<span class="cost hide-m" id="sidecost">$${t.cost.toFixed(4)} / ${k(t.tokens)}</span><button class="model-chip hide-m" data-act="model" title="${S.ctab === "review" ? "Reviewer fest auf Opus" : "Modell wechseln"}"><span class="aimg" style="width:18px;height:18px;display:inline-grid;margin-right:5px">A\\</span>${S.ctab === "review" ? "Opus 5.5 🔒" : (t.model || "Sonnet 5.5") + " ▾"}</button>` : `<span class="prio ${t.prio}">${t.prio}</span>`}`;
    body = card(t) + (S.ctab === "ticket" ? ticketBody(t) : agentBody(t, S.ctab));
  }
  return `<div class="col side ${S.mpanel === "side" ? "mshow" : ""}"><div class="col-head">${head}</div>${body}</div>`;
}

function card(t) {
  const st = steps(t), idx = stepIndex(t), [s, sc] = statusOf(t);
  const tone = { live: "", warn: "warn", bad: "bad", ok: "ok", idle: "" }[dotOf(t)];
  const sum = { grill: "Der Agent klärt den Scope mit dir, bevor er entwickelt.", implement: "Der Agent entwickelt gerade.", review: `Unabhängiges Review läuft (Runde ${t.round || 1}).`, mr: t.risks ? `Review bestanden mit ${t.risks.length} offenem Risiko – MR ${t.mr} ist ein Draft und wartet auf eine Entscheidung.` : `MR ${t.mr} wartet auf Code-Review durch einen Entwickler.`, test: `Gemerged und auf der Dev-Stage. Bitte testen.`, rework: "Der Agent arbeitet dein Finding ab. Danach folgt ein neuer MR.", done: "Erledigt.", blocked: t.why, ready: "Freigegeben – startet, sobald ein Worker frei ist.", backlog: t.kev === "vague" ? "Kev: zu vage für einen direkten Start – beginnt mit einer Klärung." : "Kev: startklar. Zum Starten freigeben." }[t.flow];
  return `<div class="icard ${tone}"><div class="itop"><span style="color:${tone === "ok" ? "var(--ready)" : "var(--bad)"}">⎇</span><strong>${t.key}</strong><span class="lchip">${LANE[t.lane]}</span><span class="ititle">${esc(t.title)}</span>${t.started || t.flow === "ready" ? `<span class="status ${sc}"><i></i>${s}</span>` : ""}</div>
    ${t.started ? `<ol class="steps">${st.map((n, i) => `<li class="${i < idx ? "done" : i === idx ? "cur" : ""}"><i></i>${n}</li>`).join("")}</ol>` : ""}
    <p class="isum">${esc(paused(t) ? `Pausiert – der Rechner von ${worker(t).owner} ist seit ${worker(t).since} offline. Der Agent macht weiter, sobald er wieder online ist.` : sum)}</p>
    ${t.risks && isDev() ? `<div class="risk"><b>⚠ Decision needed</b>${t.risks.map(([l, s]) => `<div><code>${l}</code> — ${esc(s)}</div>`).join("")}</div>` : ""}</div>`;
}

function ticketBody(t) {
  // what a PM/PO does here, without touching the agent
  if (t.flow === "grill" && !isDev()) return grill(t);
  let action = "";
  if (t.flow === "test") action = S.finding === t.key ? findingForm(t) : `<div class="card" style="margin-bottom:12px"><h2>Bereit zum Testen</h2><p style="font-size:13.5px;color:#d9cdcd;margin:6px 0 10px">Auf der Dev-Stage: <a href="#" data-act="noop">dev.shop.example.com</a> · MR ${t.mr} gemerged</p>
      <div style="display:flex;gap:8px"><button class="secondary ok" data-act="testOk" data-key="${t.key}">✓ Funktioniert</button><button class="secondary warn" data-act="finding" data-key="${t.key}">Finding melden</button></div></div>`;
  const tl = [["Von Kev eingeordnet", `${LANE[t.lane]} · ${t.tier.toLowerCase()} · ${t.kev === "vague" ? "zu vage" : "startklar"}`], ...(t.ready ? [["Für Agent freigegeben", "Lena Weber"]] : []), ...(t.started ? [["Agent gestartet", `${t.model || ""}${isDev() && worker(t) ? ` · auf ${worker(t).name}` : ""}`]] : []), ...(t.flow === "grill" && isDev() ? [["Klärung mit der PO", "2 von 4 Fragen beantwortet"]] : []), ...(t.round ? [["Unabhängig geprüft", t.risks ? "bestanden mit offenem Risiko" : "bestanden"]] : []), ...(t.mr ? [[`Merge Request ${t.mr}`, t.flow === "done" || t.flow === "test" ? "gemerged" : t.risks ? "Draft" : "offen"]] : []), ...(t.flow === "rework" ? [["Finding gemeldet", "Agent arbeitet nach"]] : [])];
  return `<div class="chat">${action}
    <div class="slabel">Verlauf</div><div class="timeline">${tl.map(([a, b], i) => `<div class="${i === tl.length - 1 && t.flow !== "done" ? "now" : ""}">${a}<small>${esc(b)}</small></div>`).join("")}</div>
    <div class="slabel" style="margin-top:14px">Aktionen</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <label style="font-size:13px;color:#d9cdcd">Priorität <select data-act="prioSel" data-key="${t.key}">${PRIOS.map((p) => `<option ${p === t.prio ? "selected" : ""}>${p}</option>`).join("")}</select></label>
      ${t.started ? "" : `<span class="rel" style="font-size:13px" data-act="release" data-key="${t.key}"><span class="sw ${t.ready ? "on" : ""}"></span>Für Agent freigeben</span>`}
      ${isDev() && !t.started ? `<button class="secondary" data-act="start" data-key="${t.key}">▶ Agent starten</button><select id="startWorker" title="Worker">${WORKERS.map((w) => `<option value="${w.id}" ${w.online ? "" : "disabled"}>auf ${w.name}${w.online ? "" : w.later ? " (später)" : " (offline)"}</option>`).join("")}</select>` : ""}
      <button class="ghost" data-act="noop">In Jira öffnen ↗</button></div></div>`;
}

function grill(t) {
  const ans = S.grill[t.key] || (S.grill[t.key] = []); const done = ans.length === GRILL.length; const q = GRILL[ans.length];
  return `<div class="chat">${GRILL.map((g, i) => i > ans.length ? "" : `<div class="entry"><div class="mlabel">AGENT <span>Frage ${i + 1}/${GRILL.length}</span></div><div class="md">${g.q}</div>${i === ans.length ? `<div class="rec"><b>Empfehlung:</b> ${g.rec}</div>` : ""}</div>${ans[i] ? `<div class="entry pi-user"><div class="mlabel">DU</div><div class="umsg">${esc(ans[i])}</div></div>` : ""}`).join("")}
    ${done ? `<div class="entry"><div class="mlabel">AGENT</div><div class="md">Alles geklärt. Bitte bestätige den Scope:</div><div class="card" style="margin-top:8px"><ol style="margin:0;padding-left:18px;font-size:13.5px">${ans.map((a, i) => `<li><b>AC-${i + 1}</b> ${esc(a)}</li>`).join("")}</ol><button class="primary" style="margin-top:10px" data-act="grillOk" data-key="${t.key}">Scope bestätigen – Agent darf loslegen</button></div></div>` : ""}</div>
    ${done ? "" : `<div class="composer-region"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><button class="secondary ok" data-act="grillAns" data-key="${t.key}" data-v="${esc(q.rec)}">Empfehlung übernehmen</button><button class="secondary" data-act="grillAns" data-key="${t.key}" data-v="${esc(q.alt)}">${q.alt}</button></div>
      <div class="composer"><textarea id="grillOwn" placeholder="Oder eigene Antwort…"></textarea><div class="ctool"><span style="font-size:12px;color:#9d8889">Klärung · ${ans.length}/${GRILL.length}</span><button class="send" data-act="grillOwn" data-key="${t.key}">↑</button></div></div></div>`}`;
}

function findingForm(t) {
  return `<div class="card" style="margin-bottom:12px;border-color:#6b5222"><h2>Finding zu ${t.key}</h2>
    <label class="field" style="margin-top:8px"><span>Was hast du gemacht?</span><textarea rows="2">1. Suche nach „Müsli“ auf der Dev-Stage</textarea></label>
    <div class="grid2"><label class="field"><span>Erwartet</span><textarea rows="2">„Bio-Müsli Classic“ erscheint</textarea></label><label class="field"><span>Tatsächlich</span><textarea rows="2" id="fActual">Keine Treffer; „Muesli“ geht</textarea></label></div>
    <div style="display:flex;gap:8px;align-items:center"><button class="primary" data-act="findingSend" data-key="${t.key}">Finding senden</button><button class="ghost" data-act="findingCancel">Abbrechen</button><span style="font-size:12px;color:#9d8889;margin-left:auto">📎 Screenshot anhängen</span></div>
    <p class="phint">Der bisherige Agent (sonst ein neuer) arbeitet nach und öffnet einen neuen MR.</p></div>`;
}

function agentBody(t, agent) {
  const items = transcript(t, agent);
  const html = items.map((it, i) => {
    if (it.k === "brief") return `<div class="entry"><div class="mlabel brief-label">⎇ ${it.label || "TICKET BRIEF"} <span>#${it.n}</span></div><div class="brief"><p>${esc(it.text)}</p><details><summary>▸ Full brief</summary><p style="margin-top:8px;font-size:12px">Jira description (the spec): …</p></details></div></div>`;
    if (it.k === "agent") return `<div class="entry ${it.isNew ? "new" : ""}"><div class="mlabel">AGENT <span>#${it.n}</span></div>${it.thinking ? `<details class="thinking"><summary>▸ Thinking</summary><div style="font-size:13px;color:#d9cdcd;padding:6px 0 0 10px;border-left:1px solid #5a3a3d;margin-top:4px">${esc(it.thinking)}</div></details>` : ""}${it.text ? `<div class="md">${esc(it.text).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>")}</div>` : ""}</div>`;
    if (it.k === "user") return `<div class="entry pi-user ${it.isNew ? "new" : ""}"><div class="mlabel">DU</div><div class="umsg">${esc(it.text)}</div></div>`;
    if (it.live) return `<div class="live-tool"><span class="spin"></span><b>${it.name}</b><code>${esc(it.arg)}</code><span style="color:var(--accent)">running</span></div>`;
    return `<details class="tool ${it.isNew ? "entry new" : ""}"><summary><span style="color:var(--ready)">✓</span><b>${it.name}</b><code>${esc(it.arg)}</code><span class="tstat">Done</span></summary><pre>${esc(it.out || "")}</pre></details>`;
  }).join("");
  const working = agent === "main" && active(t);
  return `<div class="chat" id="chat">${html}${working ? `<div class="typing"><i></i><i></i><i></i></div>` : ""}</div>
    ${agent === "main" ? `<div class="composer-region"><div class="composer"><textarea id="agentMsg" placeholder="Talk to the ${t.key} agent…"></textarea><div class="ctool"><select><option>Follow-up</option><option>Steer</option></select><span style="display:flex;gap:8px"><button class="interrupt" data-act="noop">■ Interrupt</button><button class="send" data-act="agentSend" data-key="${t.key}">↑</button></span></div></div>
      <div class="footnote"><span><span class="dot live" style="width:5px;height:5px"></span> Schließen unterbricht den Agenten nie.</span><span class="hide-m">Enter senden · Shift+Enter Zeile</span></div></div>` : `<div class="composer-region"><p class="phint">Review-Sessions sind nur lesbar. Der Reviewer sieht nie die Begründungen des Coders.</p></div>`}`;

function wireDnD() {
  const rows = document.querySelectorAll("#feedrows .log-row"); let drag = null;
  rows.forEach((r) => {
    r.addEventListener("dragstart", () => { drag = r.dataset.key; r.classList.add("drag"); });
    r.addEventListener("dragend", () => r.classList.remove("drag"));
    r.addEventListener("dragover", (e) => { e.preventDefault(); r.classList.add("over"); });
    r.addEventListener("dragleave", () => r.classList.remove("over"));
    r.addEventListener("drop", (e) => { e.preventDefault(); r.classList.remove("over"); if (!drag || drag === r.dataset.key) return;
      const order = ofProject().map((t) => t.key).filter((x) => x !== drag); order.splice(order.indexOf(r.dataset.key), 0, drag); order.forEach((x, i) => (byKey(x).rank = i));
      render(); toast(`${drag} verschoben – Rangfolge in Jira aktualisiert`); });
  });
}

  const R = 2 * Math.PI * 7, rf = document.getElementById("ringfill"), ps = document.getElementById("pollsec");
  if (rf) rf.setAttribute("stroke-dashoffset", R * (S.poll.left / S.poll.span)); if (ps) ps.textContent = S.poll.left + "s";
  if (S.poll.left === S.poll.span && left()) {
    const n = [2, 1, 3, 1, 2, 2, 1][S.arrivals % 7]; const now = new Date().toTimeString().slice(0, 8); const mine = [];

      const a = nextArrival(i); if (!a) break; S.arrivals++;
      TICKETS.push(T(a.key, a.title, a.type, a.prio, "backlog", { lane: a.lane, tier: a.tier, kev: "pending", result: a.kev, rank: -S.arrivals, found: now, isNew: true, fresh: true }));

    }
    render();
    if (mine.length) toast(`Neu aus Jira: ${mine.join(", ")} – Kev ordnet ein …`);
  }

  if (S.sel === "SHOP-149" && S.ctab === "main") S.live++;
  const t = byKey("SHOP-149"); const l = transcript(t, "main");
  for (const s of LIVE) if (S.sel === "SHOP-149" && S.ctab === "main" && s.at === S.live) {
    if (s.add) l.push({ ...s.add, isNew: true });
    if (s.done) { const last = l[l.length - 1]; last.live = false; last.out = s.out; last.isNew = true; }
    if (s.flow) { t.flow = s.flow; t.round = 1; }
    t.tokens += 6400; t.cost += 0.21;
    render();
  }
  if (active(t)) { // tick counters without a full render
    t.tokens += 180; t.cost += 0.004;
    const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
    if (S.sel === "SHOP-149") { set("sidecost", `$${t.cost.toFixed(4)} / ${k(t.tokens)}`); set("ctxnum", k(t.tokens)); set("stattok", k(t.tokens)); set("statcost", "$" + t.cost.toFixed(4)); set("ctxpct", (t.tokens / 10000).toFixed(0)); const f = document.getElementById("ctxfill"); if (f) f.style.width = t.tokens / 10000 + "%"; }
  }
}, 1000);

render();
</script>
